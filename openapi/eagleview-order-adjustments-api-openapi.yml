openapi: 3.2.0
info:
  description: '# Endpoint

    The endpoint for the sandbox integrations environment is: https://sandbox.apicenter.eagleview.com.'
  version: 1.0.0
  title: Measurement Orders Order Adjustments API
servers:
- url: https://sandbox.apicenter.eagleview.com/
tags:
- name: Order Adjustments
  description: Occasionally, a report will need to be adjusted by the customer before it can continue processing. This could be due to a necessary upgrade/downgrade due to the image quality available.
paths:
  /v2/Report/UpdateReportAddress:
    post:
      description: The UpdateReportAddress method is used for updating the report address when a report is pending the customer's response to locate the appropriate structure.
      operationId: POST/v2/Report/UpdateReportAddress
      tags:
      - Order Adjustments
      summary: UpdateReportAddress
      parameters:
      - name: reportId
        description: Report Id of the report to which the report address will be updated.
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UpdateReportAddressResponseBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReportUnAuthorizedResponseBody'
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReportAddress'
        required: true
      x-operation-id-source: normalized
      x-operation-id-original: POST /v2/Report/UpdateReportAddress
  /v2/Report/ApproveReportTypeChange:
    post:
      description: The ApproveReportTypeChange method allows the authenticating user to approve a change in report type due to available imagery.
      operationId: POST/v2/Report/ApproveReportTypeChange
      tags:
      - Order Adjustments
      summary: ApproveReportTypeChange
      parameters:
      - name: reportId
        description: Unique id generated by EagleView when an order is placed.
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Invalid ReportID or unauthorized user. Please try again with valid reportID or authorized user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReportUnAuthorizedResponseBody'
      security:
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: POST /v2/Report/ApproveReportTypeChange
  /v2/Report/DenyReportTypeChange:
    post:
      description: The DenyReportTypeChange method allows the authenticating user to deny a change in report type due to available imagery.
      operationId: POST/v2/Report/DenyReportTypeChange
      tags:
      - Order Adjustments
      summary: DenyReportTypeChange
      parameters:
      - name: reportId
        description: Unique id generated by EagleView when an order is placed.
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Invalid ReportID or unauthorized user. Please try again with valid reportID or authorized user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReportUnAuthorizedResponseBody'
      security:
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: POST /v2/Report/DenyReportTypeChange
  /v2/Report/CloseReport:
    post:
      description: The CloseReport method allows the authenticating to close a report on their account. This will stop processing on the report given it is not already completed.
      operationId: POST/v2/Report/CloseReport
      tags:
      - Order Adjustments
      summary: CloseReport
      parameters:
      - name: reportId
        description: Unique id generated by EagleView when an order is placed.
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
        '401':
          description: Invalid ReportID or unauthorized user. Please try again with valid reportID or authorized user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReportUnAuthorizedResponseBody'
      security:
      - bearerAuth: []
      x-operation-id-source: normalized
      x-operation-id-original: POST /v2/Report/CloseReport
components:
  schemas:
    GetReportUnAuthorizedResponseBody:
      type: object
      properties:
        Message:
          type: string
          description: Invalid ReportID or unauthorized user. Please try again with valid reportID or authorized user
    UpdateReportAddressResponseBody:
      type: object
      properties:
        Address:
          type: string
          maxLength: 50
          description: Street address.
        City:
          type: string
          maxLength: 50
          description: City of address.
        State:
          type: string
          maxLength: 50
          description: State Abbreviations
        Zip:
          type: string
          maxLength: 50
          description: Zip code of address.
        Country:
          type: string
          maxLength: 50
          description: Country of address.
        Latitude:
          type: number
          format: float
          description: Latitude of address.
        Longitude:
          type: number
          format: float
          description: Longitude of address.
        AddressType:
          type: integer
          description: Address Types
        VerifierUsedId:
          type: string
          description: For EagleView internal use only.
        MapperUsedId:
          type: string
          description: For EagleView internal use only.
        VerificationResultTypeId:
          type: string
          description: For EagleView internal use only.
    UpdateReportAddress:
      type: object
      properties:
        Address:
          type: string
          maxLength: 50
          description: Street address.
        City:
          type: string
          maxLength: 50
          description: City of address.
        State:
          type: string
          maxLength: 50
          description: State Abbreviations
        Zip:
          type: string
          maxLength: 50
          description: Zip code of address.
        Country:
          type: string
          maxLength: 50
          description: Country of address.
        Latitude:
          type: number
          format: float
          description: Latitude of address.
        Longitude:
          type: number
          format: float
          description: Longitude of address.
        AddressType:
          type: integer
          description: Address Types
      required:
      - Address
      - City
      - State
      - Zip
      - AddressType
  securitySchemes:
    bearerAuth:
      type: apiKey
      name: Authorization
      in: header
    basicAuth:
      type: http
      scheme: basic
      description: Unique identifier and secret provided by EagleView Integration team.
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
